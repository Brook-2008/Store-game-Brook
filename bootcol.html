<!DOCTYPE html>
<html>
<head>
    <title>Soccer Players</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            text-align: center;
            margin: 20px;
            padding: 10px;
        }

        .col {
            background-color: white;
            border: 2px solid black;
            border-style: solid;
            padding: 10px;
            margin: 5px;
        }

        img {
            width: 100%;
            height: 150px;
        }
    </style>
</head>

<body>

    <h1>My Favorite Soccer Players</h1>

    <div class="container text-center">
        <div class="row">

            <div class="col">
                <img src="messi.png">
                <h3>Messi</h3>
                <p>The GOAT.</p>
            </div>

            <div class="col">
                <img src="busquets.png">
                <h3>Busquets</h3>
                <p>Calm.</p>
            </div>

            <div class="col">
                <img src="mbappe.png">
                <h3>Mbappe</h3>
                <p>Faster than buggati.</p>
            </div>

        </div>

        <div class="row">

            <div class="col">
                <img src="haaland.png">
                <h3>Haaland</h3>
                <p>Goal machine.</p>
            </div>

            <div class="col">
                <img src="neymar.png">
                <h3>Neymar</h3>
                <p>King of dribbling.</p>
            </div>

            <div class="col">
                <img src="kdb.png">
                <h3>Kevin De Bruyne</h3>
                <p>The best playmaker.</p>
            </div>

        </div>
    </div>

</body>
</html>
