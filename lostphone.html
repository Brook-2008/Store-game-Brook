
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost My Phone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container text-center p-4">

    <h1 class="display-1 text-danger">LOST!</h1>

    <h2 class="text-primary">My Phone</h2>

    <p>
        My phone has gone missing.
        It was last seen yesterday.
        It might be somewhere at school.
        It has a black case.
        Please help me find it!
    </p>

    <div class="border border-dark border-3 p-3 mb-4">

        <h3>Pictures of My Lost Phone</h3>

        <div id="lostCarousel" class="carousel slide">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" class="d-block w-100" height="350" alt="Smartphone">
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd" class="d-block w-100" height="350" alt="Phone">
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1512499617640-c74ae3a79d37" class="d-block w-100" height="350" alt="Phone with case">
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#lostCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#lostCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>
    </div>

    <a href="https://www.google.com/search?q=how+to+find+a+lost+phone" class="btn btn-primary btn-lg">
        Help Find My Phone
    </a>

    <button class="btn btn-danger btn-lg" disabled>
        Reward Unavailable
    </button>

    <h3 class="mt-4">Report a Sighting</h3>

    <form>
        <input type="text" class="form-control mb-3" placeholder="Your name" required>

        <input type="email" class="form-control mb-3" placeholder="Your email" required>

        <textarea class="form-control mb-3" placeholder="Where did you see my phone?"></textarea>

        <button type="submit" class="btn btn-success">Submit Report</button>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
